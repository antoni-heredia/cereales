[package]
name = "cereales"
version = "0.6.0"
description = "Meeting recorder with transcription and timestamped notes"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cereales_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
ureq = "2"
whisper-rs = "0.16"

[target.'cfg(windows)'.dependencies]
# `windows-core` is listed explicitly because the #[implement] macro generates
# code that references `windows_core` from the crate root.
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_ProcessStatus",
  "Win32_Security",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  # Screen capture: GDI takes the pixels, WIC encodes them as PNG, and the HiDpi
  # call is what keeps a scaled display from being captured at logical size.
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
