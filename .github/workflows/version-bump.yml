name: Version bump

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level (auto = infer from the commits)"
        type: choice
        required: true
        default: auto
        options: [auto, major, minor, patch]

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # The bot does not retrigger itself: the commit carries [skip ci], but this
    # guard stays as well in case someone rewrites the message.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    outputs:
      tagged: ${{ steps.commit.outputs.tagged }}
      version: ${{ steps.bump.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Work out the bump level
        id: level
        run: |
          set -euo pipefail

          MANUAL="${{ github.event.inputs.level || 'auto' }}"
          if [ "$MANUAL" != "auto" ]; then
            echo "level=$MANUAL" >> "$GITHUB_OUTPUT"
            echo "Level forced manually: $MANUAL"
            exit 0
          fi

          # Range of commits to analyse: since the last tag, or since the state
          # before the push if there is no tag yet.
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "Analysing commits in: $RANGE"

          LOG="$(git log --no-merges --format=%B "$RANGE")"
          if [ -z "$(echo "$LOG" | tr -d '[:space:]')" ]; then
            echo "No new commits; not bumping the version."
            echo "level=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conventional Commits:
          #   feat!: / fix(scope)!: / BREAKING CHANGE  -> major
          #   feat: / feat(scope):                     -> minor
          #   anything else                            -> patch
          if echo "$LOG" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' || echo "$LOG" | grep -qE '^BREAKING[ -]CHANGE'; then
            LEVEL=major
          elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
            LEVEL=minor
          else
            LEVEL=patch
          fi

          echo "Detected level: $LEVEL"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Bump the version
        id: bump
        if: steps.level.outputs.level != 'none'
        run: |
          set -euo pipefail
          VERSION="$(node .github/scripts/bump-version.mjs '${{ steps.level.outputs.level }}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $VERSION"
          git diff --stat

      - name: Commit and tag
        id: commit
        if: steps.level.outputs.level != 'none'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "The version files were already up to date; nothing to commit."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$VERSION"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      # Born as a draft: the binaries job publishes it once the artifacts are
      # uploaded. If the build fails, nobody finds a visible release with
      # nothing to download.
      - name: Create a draft release
        if: steps.commit.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --draft

  # Builds on Windows and attaches the installers to the release. It lives here
  # rather than in an `on: push: tags` workflow because the tag is pushed with
  # GITHUB_TOKEN, and those tags do not trigger workflows.
  binaries:
    needs: bump
    if: needs.bump.outputs.tagged == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      tag: v${{ needs.bump.outputs.version }}
