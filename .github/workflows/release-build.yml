name: Build binaries

# Invoked from version-bump.yml rather than listening on `push: tags`: a tag
# pushed with GITHUB_TOKEN does not trigger workflows, so that trigger would
# never fire. The workflow_dispatch is there to rebuild an existing tag by hand.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build (for example v0.2.0)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        type: string
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # whisper.cpp is compiled from scratch with LTO: about 20 minutes uncached.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build
        run: npm run tauri:build

      - name: Prepare the artifacts
        id: artifacts
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cd src-tauri/target/release

          # The bare .exe carries no version in its name; without renaming it,
          # the downloads list cannot tell it apart from any other release.
          cp cereales.exe "cereales_${VERSION}_x64-portable.exe"

          echo "portable=cereales_${VERSION}_x64-portable.exe" >> "$GITHUB_OUTPUT"
          ls -la bundle/msi bundle/nsis

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PORTABLE: ${{ steps.artifacts.outputs.portable }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release
          gh release upload "$TAG" \
            bundle/msi/*.msi \
            bundle/nsis/*-setup.exe \
            "$PORTABLE" \
            --clobber

      # The release is born as a draft and only becomes visible here: if the
      # build fails, nobody finds a published, empty version.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
